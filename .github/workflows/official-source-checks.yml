name: Official scholarship source checks
on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-scholarship-source-checks
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source URLs without changing verification status
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/official_source_checks.py
      - name: Upload evidence leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-checks
          path: official-source-checks.json
          if-no-files-found: ignore
