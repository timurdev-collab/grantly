name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Grantly.xcodeproj -scheme Grantly

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Grantly.xcodeproj \
            -scheme Grantly \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
