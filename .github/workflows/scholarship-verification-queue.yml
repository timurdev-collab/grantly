name: Scholarship verification review queue
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate read-only staging review queue
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/scholarship_review_queue.py
      - name: Upload verification queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholarship-review-queue
          path: scholarship-review-queue.json
          if-no-files-found: ignore
