name: Android Debug APK
on:
  push:
    branches: [feature/android-compose-foundation]
    paths:
      - 'android/**'
      - 'project.yml'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enforce discontinued calling feature boundary
        run: |
          if grep -RniE 'io[.]livekit|LiveKit[[:space:]]*\(|livekit-token|AdvisorCallRoomContent|AdvisorLiveKitRoomSession' app/src/main app/build.gradle.kts; then
            echo "Discontinued audio/video calling code was reintroduced."
            exit 1
          fi
          if grep -Eq 'android[.]permission[.](CAMERA|RECORD_AUDIO|MODIFY_AUDIO_SETTINGS)' app/src/main/AndroidManifest.xml; then
            echo "Calling-related media permissions were reintroduced."
            exit 1
          fi
      - name: Run Android JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Upload JVM test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edut-android-jvm-test-diagnostics
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate generated APK archive
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
      - name: Generate APK SHA-256 checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edut-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 14
