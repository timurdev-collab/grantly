name: CodeQL Swift (manual XcodeGen build)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-swift:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate EduT Xcode project
        run: xcodegen generate

      - name: Initialize CodeQL for Swift
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project EduT.xcodeproj -scheme EduT

      - name: Compile EduT under CodeQL
        run: |
          set -o pipefail
          xcodebuild \
            -project EduT.xcodeproj \
            -scheme EduT \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            build

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
