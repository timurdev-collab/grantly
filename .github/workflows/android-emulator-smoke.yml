name: Android Emulator Smoke
on:
  push:
    branches: [feature/android-compose-foundation]
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run non-mutating Android navigation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            gradle :app:connectedDebugAndroidTest --stacktrace || {
              mkdir -p app/build/emulator-diagnostics
              adb logcat -d -t 4000 > app/build/emulator-diagnostics/logcat.txt || true
              adb exec-out screencap -p > app/build/emulator-diagnostics/screen.png || true
              exit 1
            }
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
