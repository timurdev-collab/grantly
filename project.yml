name: Grantly
options:
  bundleIdPrefix: com.grantly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: M9L42LN3CG
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.2
targets:
  Grantly:
    type: application
    platform: iOS
    sources:
      - Grantly
    info:
      path: Grantly/Info.plist
      properties:
        CFBundleDisplayName: Grantly
        CFBundleURLTypes:
          - CFBundleURLName: com.grantly.app
            CFBundleURLSchemes:
              - grantly
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantly.app
        PRODUCT_NAME: Grantly
        INFOPLIST_FILE: Grantly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: M9L42LN3CG
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Grantly/Grantly.entitlements
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: Supabase
        product: Supabase
