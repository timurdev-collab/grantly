name: Grantly
options:
  bundleIdPrefix: com.grantly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: M9L42LN3CG
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.2
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.17.0
targets:
  Grantly:
    type: application
    platform: iOS
    sources:
      - Grantly
    info:
      path: Grantly/Info.plist
      properties:
        CFBundleDisplayName: Grantly
        CFBundleURLTypes:
          - CFBundleURLName: com.grantly.app
            CFBundleURLSchemes:
              - grantly
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Grantly uses your camera for advisor video calls.
        NSMicrophoneUsageDescription: Grantly uses your microphone for advisor video calls.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantly.app
        PRODUCT_NAME: Grantly
        INFOPLIST_FILE: Grantly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: M9L42LN3CG
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Grantly/GrantlyDebug.entitlements
          APP_ENVIRONMENT: staging
          SUPABASE_URL: https://cbzriyarlvpmtfbjgede.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_7DtXndOsfZ5WmTZs0RWG8w_EIQ3xZSe
        Release:
          CODE_SIGN_ENTITLEMENTS: Grantly/Grantly.entitlements
          APS_ENVIRONMENT: production
          APP_ENVIRONMENT: production
          SUPABASE_URL: https://bvcabjwriszghmizbwji.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8zllTlQ9y95acFTsw0uljg_XZ4nuli2
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LiveKit
        product: LiveKit

  GrantlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GrantlyTests
    dependencies:
      - target: Grantly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantly.tests
        GENERATE_INFOPLIST_FILE: YES
