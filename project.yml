name: EduT
options:
  bundleIdPrefix: com.grantly
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Staging: debug
  ProductionPreview: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: M9L42LN3CG
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.2
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.17.0
targets:
  EduT:
    type: application
    platform: iOS
    sources:
      - Grantly
    info:
      path: Grantly/Info.plist
      properties:
        CFBundleDisplayName: EduT
        CFBundleURLTypes:
          - CFBundleURLName: com.grantly.app
            CFBundleURLSchemes:
              - grantly
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: EduT uses your camera for advisor video calls.
        NSMicrophoneUsageDescription: EduT uses your microphone for advisor video calls.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantly.app
        PRODUCT_NAME: EduT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Grantly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: M9L42LN3CG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Grantly/GrantlyDebug.entitlements
          APP_ENVIRONMENT: production
          SUPABASE_URL: https://bvcabjwriszghmizbwji.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8zllTlQ9y95acFTsw0uljg_XZ4nuli2
        Staging:
          CODE_SIGN_ENTITLEMENTS: Grantly/GrantlyDebug.entitlements
          APP_ENVIRONMENT: staging
          SUPABASE_URL: https://cbzriyarlvpmtfbjgede.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_7DtXndOsfZ5WmTZs0RWG8w_EIQ3xZSe
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
        ProductionPreview:
          CODE_SIGN_ENTITLEMENTS: Grantly/GrantlyDebug.entitlements
          APP_ENVIRONMENT: production
          SUPABASE_URL: https://bvcabjwriszghmizbwji.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8zllTlQ9y95acFTsw0uljg_XZ4nuli2
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PRODUCTION_PREVIEW
        Release:
          CODE_SIGN_ENTITLEMENTS: Grantly/Grantly.entitlements
          APS_ENVIRONMENT: production
          APP_ENVIRONMENT: production
          SUPABASE_URL: https://bvcabjwriszghmizbwji.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8zllTlQ9y95acFTsw0uljg_XZ4nuli2
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LiveKit
        product: LiveKit

  EduTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GrantlyTests
    dependencies:
      - target: EduT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantly.tests
        GENERATE_INFOPLIST_FILE: YES

  EduTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrantlyUITests
    dependencies:
      - target: EduT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grantly.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EduT:
    build:
      targets:
        EduT: all
        EduTTests: [test]
        EduTUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EduTTests
        - EduTUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  "EduT Production Preview":
    build:
      targets:
        EduT: all
    run:
      config: ProductionPreview
    profile:
      config: ProductionPreview
    analyze:
      config: ProductionPreview
    archive:
      config: Release


  "EduT Staging":
    build:
      targets:
        EduT: all
        EduTTests: [test]
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - EduTTests
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Release
